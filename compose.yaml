services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_NAME: "${APP_NAME:-Customers Manager HUB}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://cmh:change-me@postgres:5432/customers_manager_hub}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RATE_LIMIT_LOGIN_REQUESTS: "${RATE_LIMIT_LOGIN_REQUESTS:-10}"
      RATE_LIMIT_PUBLIC_REQUESTS: "${RATE_LIMIT_PUBLIC_REQUESTS:-120}"
      RATE_LIMIT_WEBHOOK_REQUESTS: "${RATE_LIMIT_WEBHOOK_REQUESTS:-180}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      WORKER_MAX_DELIVERY_ATTEMPTS: "${WORKER_MAX_DELIVERY_ATTEMPTS:-5}"
      TELEGRAM_WEBHOOK_BASE_URL: "${TELEGRAM_WEBHOOK_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_GEMINI_API_KEY: "${GOOGLE_GEMINI_API_KEY:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://object-storage:8333}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-cmh-dev-access}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-cmh-dev-secret}"
      S3_BUCKET: "${S3_BUCKET:-cmh-knowledge}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2); response.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "customers_manager_hub.worker"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_NAME: "${APP_NAME:-Customers Manager HUB}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://cmh:change-me@postgres:5432/customers_manager_hub}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      WORKER_MAX_DELIVERY_ATTEMPTS: "${WORKER_MAX_DELIVERY_ATTEMPTS:-5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_GEMINI_API_KEY: "${GOOGLE_GEMINI_API_KEY:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://object-storage:8333}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-cmh-dev-access}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-cmh-dev-secret}"
      S3_BUCKET: "${S3_BUCKET:-cmh-knowledge}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    networks:
      - cmh

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres/Dockerfile
      args:
        POSTGRES_VERSION: 18.6-bookworm
        PGVECTOR_COMMIT: 8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c
    image: customers-manager-hub/postgres:18.6-pgvector0.8.6
    container_name: cmh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customers_manager_hub}
      POSTGRES_USER: ${POSTGRES_USER:-cmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmh} -d ${POSTGRES_DB:-customers_manager_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  redis:
    image: redis:8.8.2-trixie
    container_name: cmh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cmh

  object-storage:
    image: chrislusf/seaweedfs:4.44
    container_name: cmh-object-storage
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-cmh-dev-access}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-cmh-dev-secret}"
      S3_BUCKET: "${S3_BUCKET:-cmh-knowledge}"
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - object_storage_data:/data
    networks:
      - cmh

volumes:
  postgres_data:
  redis_data:
  object_storage_data:

networks:
  cmh:
    driver: bridge
