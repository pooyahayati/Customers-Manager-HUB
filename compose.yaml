services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_NAME: "${APP_NAME:-Customers Manager HUB}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://cmh:change-me@postgres:5432/customers_manager_hub}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2); response.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres/Dockerfile
      args:
        POSTGRES_VERSION: 18.6-bookworm
        PGVECTOR_COMMIT: 8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c
    image: customers-manager-hub/postgres:18.6-pgvector0.8.6
    container_name: cmh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customers_manager_hub}
      POSTGRES_USER: ${POSTGRES_USER:-cmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmh} -d ${POSTGRES_DB:-customers_manager_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  redis:
    image: redis:8.8.2-trixie
    container_name: cmh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cmh

# Object storage is intentionally not started in the bootstrap Compose file.
# Before application file storage is implemented, select and document an actively
# maintained S3-compatible self-hosted backend through an ADR. The application
# contract remains S3-compatible so cloud S3 providers can also be used.
#
# Worker service will be added only after its runtime entrypoint provides
# meaningful runnable behavior.

volumes:
  postgres_data:
  redis_data:

networks:
  cmh:
    driver: bridge
