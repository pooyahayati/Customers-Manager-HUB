services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres/Dockerfile
      args:
        POSTGRES_VERSION: 18.6-bookworm
        PGVECTOR_COMMIT: 8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c
    image: customers-manager-hub/postgres:18.6-pgvector0.8.6
    container_name: cmh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customers_manager_hub}
      POSTGRES_USER: ${POSTGRES_USER:-cmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmh} -d ${POSTGRES_DB:-customers_manager_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cmh

  redis:
    image: redis:8.8-bookworm
    container_name: cmh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cmh

# Object storage is intentionally not started in the bootstrap Compose file.
# MinIO Community prebuilt images are now legacy/unmaintained. Before application
# file storage is implemented, select and document an actively maintained
# S3-compatible self-hosted backend through an ADR. The application contract
# remains S3-compatible so cloud S3 providers can also be used.
#
# Application services (`api`, `worker`, `web`) will be added in Milestone 1
# after their Dockerfiles and runtime entrypoints exist. Keeping them out of the
# bootstrap compose avoids non-runnable placeholder containers.

volumes:
  postgres_data:
  redis_data:

networks:
  cmh:
    driver: bridge
