name: Web Lock Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  web-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version
          node --version

      - name: Resolve lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @customers-manager-hub/web typecheck

      - name: Build
        run: pnpm --filter @customers-manager-hub/web build

      - name: Commit lockfile if generated
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(web): lock frontend dependencies"
            git push origin HEAD:feat/web-runtime-skeleton
          fi
