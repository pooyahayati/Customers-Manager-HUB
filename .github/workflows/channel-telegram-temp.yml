name: Channel Telegram Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  channel-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cmh:change-me@127.0.0.1:5432/customers_manager_hub
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Refresh lockfile
        run: uv lock

      - name: Apply known static fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gateway = Path("apps/api/src/customers_manager_hub/channel_gateway.py")
          content = gateway.read_text()
          if "def empty_channel_metadata()" not in content:
              anchor = "\n\n@dataclass(frozen=True, slots=True)\nclass CanonicalAttachment:"
              insert = "\n\ndef empty_channel_metadata() -> dict[str, object]:\n    return {}\n" + anchor
              content = content.replace(anchor, insert, 1)
          content = content.replace(
              "field(default_factory=dict)",
              "field(default_factory=empty_channel_metadata)",
          )
          gateway.write_text(content)

          queue = Path("apps/api/src/customers_manager_hub/channel_queue.py")
          content = queue.read_text().replace(
              "return Redis.from_url(settings.redis_url, decode_responses=True)",
              "return Redis.from_url(settings.redis_url, decode_responses=True)  # pyright: ignore[reportUnknownMemberType]",
          )
          queue.write_text(content)

          channels = Path("apps/api/src/customers_manager_hub/channels.py")
          content = channels.read_text()
          content = content.replace(
              "from typing import Annotated, cast",
              "from typing import Annotated, Never, cast",
          )
          content = content.replace(
              '    def require_change(self) -> "ChannelUpdate":',
              "    def require_change(self) -> ChannelUpdate:",
          )
          content = content.replace(
              "def _raise_provider_error(exc: ChannelProviderError) -> None:",
              "def _raise_provider_error(exc: ChannelProviderError) -> Never:",
          )
          content = content.replace(
              "def _raise_runtime_error(exc: ChannelRuntimeError) -> None:",
              "def _raise_runtime_error(exc: ChannelRuntimeError) -> Never:",
          )
          channels.write_text(content)

          telegram_test = Path("apps/api/tests/test_telegram.py")
          content = telegram_test.read_text()
          if "from typing import cast" not in content:
              content = content.replace("import json\n", "import json\nfrom typing import cast\n", 1)
          content = content.replace(
              "payload = json.loads(request.content.decode()) if request.content else {}",
              "payload = cast(dict[str, object], json.loads(request.content.decode())) if request.content else {}",
          )
          telegram_test.write_text(content)

          integration_test = Path("apps/api/tests/test_telegram_channel_integration.py")
          content = integration_test.read_text().replace(
              "SYNC_REDIS = Redis.from_url(REDIS_URL, decode_responses=True)",
              "SYNC_REDIS = Redis.from_url(REDIS_URL, decode_responses=True)  # pyright: ignore[reportUnknownMemberType]",
          )
          integration_test.write_text(content)
          PY

      - name: Apply canonical Ruff formatting
        run: uv run ruff format .

      - name: Commit generated validation fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock apps/api pyproject.toml
          git commit -m "chore: refresh Telegram milestone validation state"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Frozen dependency sync
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Unit and connector contract tests
        run: uv run pytest

      - name: Start PostgreSQL and Redis
        run: docker compose -f compose.yaml up -d --build postgres redis

      - name: Wait for dependencies
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f compose.yaml exec -T postgres pg_isready -U cmh -d customers_manager_hub >/dev/null 2>&1 && docker compose -f compose.yaml exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml ps
          exit 1

      - name: Apply migrations
        run: DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head

      - name: Verify migration metadata is current
        run: DATABASE_URL="$TEST_DATABASE_URL" uv run alembic check

      - name: Run PostgreSQL and Redis integration suite
        run: RUN_DB_INTEGRATION=1 DATABASE_URL="$TEST_DATABASE_URL" REDIS_URL="$TEST_REDIS_URL" uv run pytest

      - name: Build backend image
        run: docker compose -f compose.yaml build api

      - name: Verify migration command inside backend image
        run: docker compose -f compose.yaml run --rm api alembic upgrade head

      - name: Start full application stack
        run: docker compose -f compose.yaml up -d --build

      - name: Verify full runtime
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ready

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null

          test "$(docker compose -f compose.yaml ps --services --status running | wc -l)" -eq 5
          test "$(docker compose -f compose.yaml exec -T api id -u)" != "0"
          test "$(docker compose -f compose.yaml exec -T worker id -u)" != "0"
          docker compose -f compose.yaml logs worker | grep -q 'worker started'

      - name: Show service state
        if: always()
        run: docker compose -f compose.yaml ps

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
