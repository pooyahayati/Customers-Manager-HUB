name: Auth Lock Temporary

on:
  push:
    branches:
      - feat/tenant-auth-rbac-foundation

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/tenant-auth-rbac-foundation

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Resolve lockfile
        run: uv lock

      - name: Verify frozen sync
        run: uv sync --frozen

      - name: Verify imports
        run: uv run python -c "import alembic, argon2, sqlalchemy; print(sqlalchemy.__version__)"

      - name: Commit lockfile
        run: |
          git add uv.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(auth): refresh python lockfile"
            git pull --rebase origin feat/tenant-auth-rbac-foundation
            git push origin HEAD:feat/tenant-auth-rbac-foundation
          fi
