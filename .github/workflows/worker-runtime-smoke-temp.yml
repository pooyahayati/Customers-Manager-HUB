name: Worker Runtime Smoke Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Validate Compose
        run: docker compose -f compose.yaml config --quiet

      - name: Build and start stack
        run: docker compose -f compose.yaml up -d --build

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ready

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null

          test "$(docker compose -f compose.yaml ps --services --status running | wc -l)" -eq 5
          test "$(docker compose -f compose.yaml exec -T worker id -u)" != "0"
          docker compose -f compose.yaml logs worker | grep -q 'worker started'

      - name: Verify worker graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml stop -t 10 worker
          docker compose -f compose.yaml logs worker | grep -q 'worker shutdown requested'
          docker compose -f compose.yaml logs worker | grep -q 'worker stopped'
          docker compose -f compose.yaml start worker
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' $(docker compose -f compose.yaml ps -q worker))" = "true" ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Show service state
        if: always()
        run: docker compose -f compose.yaml ps

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
