name: Website Chat Validation Temporary

on:
  push:
    branches:
      - feat/website-chat-channel

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cmh
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: customers_manager_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cmh -d customers_manager_hub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://cmh:change-me@localhost:5432/customers_manager_hub
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      APP_SECRET_KEY: test-app-secret
      JWT_SECRET_KEY: test-jwt-secret
      ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/website-chat-channel

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync frozen dependencies
        run: uv sync --frozen

      - name: Apply staged Milestone 7 patch
        run: |
          uv run python .github/m7_website_chat_apply.py
          uv run python .github/m7_website_chat_followup.py

      - name: Format and lint
        run: |
          uv run ruff check --fix apps/api/src apps/api/tests
          uv run ruff format apps/api/src apps/api/tests
          uv run ruff check apps/api/src apps/api/tests
          uv run ruff format --check apps/api/src apps/api/tests

      - name: Type check
        run: uv run pyright

      - name: Widget syntax
        run: node --check apps/webchat/widget.js

      - name: Unit regression
        run: uv run pytest apps/api/tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Website integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: uv run pytest apps/api/tests/test_website_chat_integration.py

      - name: Telegram and Agent regression
        env:
          RUN_DB_INTEGRATION: "1"
        run: >-
          uv run pytest
          apps/api/tests/test_telegram_channel_integration.py
          apps/api/tests/test_agent_prompt_integration.py
