name: M8 Docker Temporary

on:
  push:
    branches:
      - feat/tool-runtime

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      TELEGRAM_WEBHOOK_BASE_URL: https://agents.example.test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tool-runtime
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api worker web postgres
      - name: Start data services
        run: docker compose up -d postgres redis
      - name: Apply migrations in backend image
        run: docker compose run --rm api alembic upgrade head
      - name: Start full stack
        run: docker compose up -d api worker web
      - name: Verify stack readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color api worker web
              exit 1
            fi
            sleep 2
          done
          docker compose ps
          test "$(docker compose ps --status running --services | grep -c '^worker$')" -eq 1
      - name: Verify migration drift in runtime image
        run: docker compose exec -T api alembic check
      - name: Verify API and worker are non-root
        run: |
          test "$(docker compose exec -T api id -u | tr -d '\r')" != "0"
          test "$(docker compose exec -T worker id -u | tr -d '\r')" != "0"
      - name: Show worker status
        run: docker compose logs --no-color --tail=100 worker
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
