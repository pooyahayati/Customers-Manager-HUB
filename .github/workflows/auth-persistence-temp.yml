name: Auth Persistence Temporary

on:
  push:
    branches:
      - feat/tenant-auth-rbac-foundation

permissions:
  contents: write

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/tenant-auth-rbac-foundation

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply required style fixes
        run: |
          uv run ruff format apps/api/src/customers_manager_hub/models.py migrations/versions/0001_tenant_auth_rbac.py
          uv run ruff check --fix apps/api/src/customers_manager_hub/models.py migrations/versions/0001_tenant_auth_rbac.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/customers_manager_hub/models.py migrations/versions/0001_tenant_auth_rbac.py
            git commit -m "style(auth): apply ruff fixes"
            git pull --rebase origin feat/tenant-auth-rbac-foundation
            git push origin HEAD:feat/tenant-auth-rbac-foundation
          fi

      - name: Python quality
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest

      - name: Start PostgreSQL
        run: docker compose -f compose.yaml up -d --build postgres

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' cmh-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs postgres
          exit 1

      - name: Verify migrations
        env:
          DATABASE_URL: postgresql+psycopg://cmh:change-me@127.0.0.1:5432/customers_manager_hub
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python - <<'PY'
          import psycopg
          required = {"platform_users", "tenants", "tenant_memberships", "auth_sessions", "audit_events", "alembic_version"}
          with psycopg.connect("postgresql://cmh:change-me@127.0.0.1:5432/customers_manager_hub") as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT tablename FROM pg_tables WHERE schemaname = 'public'")
                  present = {row[0] for row in cur.fetchall()}
          missing = required - present
          if missing:
              raise SystemExit(f"missing tables: {sorted(missing)}")
          PY

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
