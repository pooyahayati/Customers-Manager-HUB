name: M8 Runtime Staging Temporary

on:
  push:
    branches:
      - feat/tool-runtime

permissions:
  contents: read

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-app-secret
      JWT_SECRET_KEY: test-jwt-secret
      ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tool-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply runtime integration and lock dependencies
        run: |
          uv lock
          uv sync --frozen
          uv run python .github/m8_apply_runtime.py
          uv run python .github/m8_fix_stage.py
          uv run ruff check --fix apps/api/src apps/api/tests
          uv run ruff format apps/api/src apps/api/tests
      - name: Static and unit regression
        run: |
          uv run ruff check apps/api/src apps/api/tests
          uv run ruff format --check apps/api/src apps/api/tests
          uv run pyright
          uv run pytest apps/api/tests
      - name: Stage validated files
        run: |
          mkdir -p /tmp/m8-runtime/apps/api/migrations
          mkdir -p /tmp/m8-runtime/apps/api/src/customers_manager_hub
          cp pyproject.toml uv.lock /tmp/m8-runtime/
          cp apps/api/migrations/env.py /tmp/m8-runtime/apps/api/migrations/env.py
          cp apps/api/src/customers_manager_hub/agent_runtime.py /tmp/m8-runtime/apps/api/src/customers_manager_hub/
          cp apps/api/src/customers_manager_hub/ai_gateway.py /tmp/m8-runtime/apps/api/src/customers_manager_hub/
          cp apps/api/src/customers_manager_hub/main.py /tmp/m8-runtime/apps/api/src/customers_manager_hub/
          cp apps/api/src/customers_manager_hub/tool_runtime.py /tmp/m8-runtime/apps/api/src/customers_manager_hub/
          cp apps/api/src/customers_manager_hub/worker.py /tmp/m8-runtime/apps/api/src/customers_manager_hub/
      - uses: actions/upload-artifact@v4
        with:
          name: m8-runtime-staged
          path: /tmp/m8-runtime
          if-no-files-found: error
