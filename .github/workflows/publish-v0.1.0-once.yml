name: Publish v0.1.0 Once

on:
  push:
    branches:
      - "release/v0.1.0-publish-once"

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: publish-v0.1.0-once
  cancel-in-progress: false

jobs:
  publish:
    name: Publish v0.1.0
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: "17ee67515cc404cb4861c9f7984026da65239a17"
      RELEASE_TAG: "v0.1.0"
      VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "17ee67515cc404cb4861c9f7984026da65239a17"
          fetch-depth: 0

      - name: Verify immutable release target and green gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          project_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )
          test "${project_version}" = "${VERSION}"
          ci_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\")] | length")
          security_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/security.yml/runs?branch=main&event=push&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\")] | length")
          test "${ci_count}" -ge 1
          test "${security_count}" -ge 1
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish immutable images
        shell: bash
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          prefix="ghcr.io/${owner}/customers-manager-hub"
          api_image="${prefix}-api"
          web_image="${prefix}-web"
          postgres_image="${prefix}-postgres"
          source="https://github.com/${GITHUB_REPOSITORY}"

          docker build \
            --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.revision=${TARGET_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -f apps/api/Dockerfile \
            -t "${api_image}:${VERSION}" \
            .
          docker build \
            --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.revision=${TARGET_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -f apps/web/Dockerfile \
            -t "${web_image}:${VERSION}" \
            .
          docker build \
            --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.revision=${TARGET_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --build-arg POSTGRES_VERSION=18.6-bookworm \
            --build-arg PGVECTOR_COMMIT=8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c \
            -f infra/docker/postgres/Dockerfile \
            -t "${postgres_image}:${VERSION}" \
            .

          docker push "${api_image}:${VERSION}"
          docker push "${web_image}:${VERSION}"
          docker push "${postgres_image}:${VERSION}"

          cat > release-manifest.txt <<EOF
          source_sha=${TARGET_SHA}
          api_image=${api_image}:${VERSION}
          worker_image=${api_image}:${VERSION}
          web_image=${web_image}:${VERSION}
          postgres_image=${postgres_image}:${VERSION}
          EOF

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --target "${TARGET_SHA}" \
            --title "Customers Manager HUB ${RELEASE_TAG}" \
            --generate-notes \
            release-manifest.txt
