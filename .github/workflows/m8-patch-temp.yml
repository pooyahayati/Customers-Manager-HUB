name: M8 Patch Temporary

on:
  push:
    branches:
      - feat/tool-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: clean M8 integration test imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tool-runtime
      - name: Remove stale integration test import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/tests/test_tool_integration.py')
          text = path.read_text()
          old = '    ToolCredential,\n    ToolDefinition,\n    ToolExecution,\n'
          new = '    ToolCredential,\n    ToolExecution,\n'
          if old not in text:
              raise SystemExit('expected import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/tests/test_tool_integration.py
          git commit -m 'fix: clean M8 integration test imports'
          git push origin HEAD:feat/tool-runtime
