name: Auth Timing Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cmh:change-me@127.0.0.1:5432/customers_manager_hub

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Frozen dependency sync
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Start PostgreSQL
        run: docker compose -f compose.yaml up -d --build postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f compose.yaml exec -T postgres pg_isready -U cmh -d customers_manager_hub >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml logs postgres
          exit 1

      - name: Apply migration
        run: DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head

      - name: Run auth integration tests
        run: RUN_DB_INTEGRATION=1 DATABASE_URL="$TEST_DATABASE_URL" uv run pytest apps/api/tests/test_tenant_auth_integration.py

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
