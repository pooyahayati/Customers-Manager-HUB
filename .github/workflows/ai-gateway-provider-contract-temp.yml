name: AI Gateway Provider Contract Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Apply reserved transcription parameter guard
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/customers_manager_hub/ai_providers.py")
          content = path.read_text()
          old = """        for key, value in parameters.items():
              if isinstance(value, bool):
          """
          new = """        for key, value in parameters.items():
              if key.strip().casefold() in {\"model\", \"file\"}:
                  raise AIProviderError(\"openai_reserved_transcription_parameter\", retryable=False)
              if isinstance(value, bool):
          """
          if old not in content:
              raise SystemExit("Expected OpenAI transcription parameter loop not found")
          path.write_text(content.replace(old, new, 1))
          PY
          uv run ruff format apps/api/src/customers_manager_hub/ai_providers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/customers_manager_hub/ai_providers.py
          git commit -m "fix: protect configured transcription model"
          git push origin "HEAD:${{ github.head_ref }}"
