name: AI Gateway Provider Contract Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Apply reserved transcription parameter guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/customers_manager_hub/ai_providers.py")
          lines = path.read_text().splitlines()
          anchor = '        data: dict[str, str] = {"model": model_id}'
          anchor_index = lines.index(anchor)
          loop_index = next(
              index
              for index in range(anchor_index + 1, min(anchor_index + 8, len(lines)))
              if lines[index].strip() == "for key, value in parameters.items():"
          )
          guard_line = '            if key.strip().casefold() in {"model", "file"}:'
          if guard_line not in lines[loop_index + 1 : loop_index + 5]:
              lines[loop_index + 1 : loop_index + 1] = [
                  guard_line,
                  '                raise AIProviderError("openai_reserved_transcription_parameter", retryable=False)',
              ]
          path.write_text("\n".join(lines) + "\n")
          PY
          uv run ruff format apps/api/src/customers_manager_hub/ai_providers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/customers_manager_hub/ai_providers.py
          git commit -m "fix: protect configured transcription model"
          git push origin "HEAD:${{ github.head_ref }}"
