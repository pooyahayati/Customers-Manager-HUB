name: AI Gateway Provider Contract Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Frozen dependency sync
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Provider contract tests
        run: uv run pytest apps/api/tests/test_ai_providers.py apps/api/tests/test_ai_provider_contract_hardening.py

      - name: Unit suite
        run: uv run pytest

      - name: Build backend image
        run: docker compose -f compose.yaml build api

      - name: Verify clean working tree
        run: test -z "$(git status --porcelain)"
