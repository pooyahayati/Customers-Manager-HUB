name: M14 Static Temporary

on:
  push:
    branches:
      - feat/m14-analytics-usage-cost

permissions:
  contents: write

jobs:
  static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Normalize M14 source
        run: |
          sed -i 's/from sqlalchemy import or_, select/from sqlalchemy import select/' apps/api/src/customers_manager_hub/analytics.py
          sed -i '/from customers_manager_hub.agent_models import AgentRun/d' apps/api/src/customers_manager_hub/analytics.py
          uv run ruff check --fix apps/api/src/customers_manager_hub/analytics.py apps/api/src/customers_manager_hub/analytics_models.py apps/api/tests/test_analytics_integration.py
          uv run ruff format apps/api/src/customers_manager_hub/analytics.py apps/api/src/customers_manager_hub/analytics_models.py apps/api/tests/test_analytics_integration.py
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/api/src/customers_manager_hub/analytics.py apps/api/src/customers_manager_hub/analytics_models.py apps/api/tests/test_analytics_integration.py
            git commit -m 'style: normalize M14 analytics'
            git push
          fi
      - run: uv run ruff check apps/api/src apps/api/tests
      - run: uv run ruff format --check apps/api/src apps/api/tests
      - run: uv run pyright apps/api/src apps/api/tests
