name: M11 Artifact Import Temporary

on:
  push:
    branches: [feat/m11-human-handoff]
    paths:
      - .github/workflows/m11-artifact-import-temp.yml

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m11-human-handoff

      - name: Download validated M11 source artifact
        uses: actions/download-artifact@v5
        with:
          name: m11-staged-source
          path: /tmp/m11-staged
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34140713204

      - name: Import validated source
        run: |
          cp /tmp/m11-staged/migrations/env.py apps/api/migrations/env.py
          cp /tmp/m11-staged/migrations/versions/0009_human_handoff.py apps/api/migrations/versions/0009_human_handoff.py
          cp /tmp/m11-staged/src/customers_manager_hub/agent_models.py apps/api/src/customers_manager_hub/agent_models.py
          cp /tmp/m11-staged/src/customers_manager_hub/agent_runtime.py apps/api/src/customers_manager_hub/agent_runtime.py
          cp /tmp/m11-staged/src/customers_manager_hub/handoff.py apps/api/src/customers_manager_hub/handoff.py
          cp /tmp/m11-staged/src/customers_manager_hub/handoff_models.py apps/api/src/customers_manager_hub/handoff_models.py
          cp /tmp/m11-staged/src/customers_manager_hub/handoff_runtime.py apps/api/src/customers_manager_hub/handoff_runtime.py
          cp /tmp/m11-staged/src/customers_manager_hub/main.py apps/api/src/customers_manager_hub/main.py
          cp /tmp/m11-staged/src/customers_manager_hub/worker.py apps/api/src/customers_manager_hub/worker.py
          cp /tmp/m11-staged/tests/test_handoff_integration.py apps/api/tests/test_handoff_integration.py
          git diff --check

      - name: Commit validated M11 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/migrations/env.py \
                  apps/api/migrations/versions/0009_human_handoff.py \
                  apps/api/src/customers_manager_hub/agent_models.py \
                  apps/api/src/customers_manager_hub/agent_runtime.py \
                  apps/api/src/customers_manager_hub/handoff.py \
                  apps/api/src/customers_manager_hub/handoff_models.py \
                  apps/api/src/customers_manager_hub/handoff_runtime.py \
                  apps/api/src/customers_manager_hub/main.py \
                  apps/api/src/customers_manager_hub/worker.py \
                  apps/api/tests/test_handoff_integration.py
          if git diff --cached --quiet; then
            echo "Validated source already matches branch"
            exit 0
          fi
          git commit -m "feat: integrate validated M11 handoff runtime"
          git push origin HEAD:feat/m11-human-handoff
