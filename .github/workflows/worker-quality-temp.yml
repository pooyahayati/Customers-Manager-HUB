name: Worker Quality Temporary

on:
  push:
    branches:
      - feat/worker-runtime-skeleton

permissions:
  contents: read

jobs:
  worker-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Validate Compose
        run: docker compose -f compose.yaml config --quiet

      - name: Start worker stack
        run: docker compose -f compose.yaml up -d --build postgres redis worker

      - name: Verify worker runtime
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            state="$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q worker)")"
            if [ "$state" = "running" ] && docker compose logs worker | grep -q 'worker started'; then
              break
            fi
            docker compose logs worker
            sleep 0.5
          done
          test "$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q worker)")" = "running"
          docker compose logs worker | grep -q 'worker started'
          test "$(docker inspect -f '{{.Config.User}}' "$(docker compose ps -q worker)")" = "app"

      - name: Verify graceful shutdown
        run: |
          set -euo pipefail
          docker compose stop -t 10 worker
          docker compose logs worker
          docker compose logs worker | grep -q 'worker shutdown requested'
          docker compose logs worker | grep -q 'worker stopped'

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
