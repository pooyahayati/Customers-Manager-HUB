name: Worker PR Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Python quality
        run: |
          uv sync --frozen
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest

      - name: Full stack smoke
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml up -d --build
          for _ in $(seq 1 60); do
            api_ok=0
            web_ok=0
            worker_ok=0
            curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && api_ok=1 || true
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && web_ok=1 || true
            docker compose logs worker | grep -q 'worker started' && worker_ok=1 || true
            if [ "$api_ok" -eq 1 ] && [ "$web_ok" -eq 1 ] && [ "$worker_ok" -eq 1 ]; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ready
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          docker compose logs worker | grep -q 'worker started'
          test "$(docker inspect -f '{{.Config.User}}' "$(docker compose ps -q worker)")" = "app"
          test "$(docker compose ps --status running -q | wc -l)" -eq 5
          docker compose stop -t 10 worker
          docker compose logs worker | grep -q 'worker shutdown requested'
          docker compose logs worker | grep -q 'worker stopped'

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
