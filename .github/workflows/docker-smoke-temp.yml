name: Docker API Smoke Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Build API and PostgreSQL images
        run: docker compose -f compose.yaml build api postgres

      - name: Start runtime services
        run: docker compose -f compose.yaml up -d postgres redis api

      - name: Wait for API liveness
        run: timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8000/health >/dev/null; do sleep 2; done'

      - name: Wait for API readiness
        run: timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; do sleep 2; done'

      - name: Verify API runs as non-root
        run: test "$(docker compose -f compose.yaml exec -T api id -u)" != "0"

      - name: Show service status
        run: docker compose -f compose.yaml ps

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
