name: Backend Quality Temporary

on:
  push:
    branches:
      - feat/runtime-skeleton

permissions:
  contents: write

jobs:
  backend-quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Resolve lockfile
        run: uv lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'build: add resolved Python lockfile [skip ci]'
          git push
