name: Backend Quality Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Resolve lockfile
        run: uv lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v7
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
