name: M12 Finalize Temporary

on:
  push:
    branches: [feat/m12-customer-memory]
    paths: [.github/workflows/m12-finalize-temp.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: cmh
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: customers_manager_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmh -d customers_manager_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://cmh:change-me@localhost:5432/customers_manager_hub
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_INTEGRATION: "1"
      ENCRYPTION_KEY: dmFsaWRfdGVzdF9rZXlfMzJfYnl0ZXNfbG9uZ19fX18=
      TELEGRAM_WEBHOOK_BASE_URL: https://channels.example.test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m12-customer-memory
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Preserve memory provenance and monotonic freshness
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/api/src/customers_manager_hub/memory.py')
          text = api.read_text()
          old = '''    if changed:\n        item.source_type = MemorySourceType.MANUAL.value\n        item.created_by_user_id = context.current.user.id\n        item.source_message_id = None\n        item.source_conversation_id = None\n        item.observed_at = now\n        db.add(\n            AuditEvent(\n'''
          new = '''    if changed:\n        db.add(\n            AuditEvent(\n'''
          if old not in text and new not in text:
              raise SystemExit('API provenance anchor not found')
          text = text.replace(old, new)
          api.write_text(text)

          runtime = Path('apps/api/src/customers_manager_hub/memory_runtime.py')
          value = runtime.read_text()
          old = '''            if existing is not None:\n                if (\n                    existing.source_type == MemorySourceType.MANUAL.value\n                    and existing.verified_at is not None\n                ):\n                    continue\n                existing.value = candidate.value\n                existing.evidence_kind = candidate.evidence_kind.value\n                existing.confidence = candidate.confidence\n                existing.source_type = MemorySourceType.CUSTOMER_MESSAGE.value\n                existing.source_message_id = source_message_id\n                existing.source_conversation_id = conversation_id\n                existing.created_by_user_id = None\n                existing.observed_at = observed_at\n                existing.expires_at = expires_at\n                existing.verified_at = None\n                existing.verified_by_user_id = None\n                written += 1\n                continue\n'''
          new = '''            if existing is not None:\n                if existing.source_type == MemorySourceType.MANUAL.value:\n                    continue\n                if existing.observed_at > observed_at:\n                    continue\n                preserve_verification = (\n                    existing.value.casefold() == candidate.value.casefold()\n                    and existing.evidence_kind == candidate.evidence_kind.value\n                )\n                existing.value = candidate.value\n                existing.evidence_kind = candidate.evidence_kind.value\n                existing.confidence = candidate.confidence\n                existing.source_type = MemorySourceType.CUSTOMER_MESSAGE.value\n                existing.source_message_id = source_message_id\n                existing.source_conversation_id = conversation_id\n                existing.created_by_user_id = None\n                existing.observed_at = observed_at\n                existing.expires_at = expires_at\n                if not preserve_verification:\n                    existing.verified_at = None\n                    existing.verified_by_user_id = None\n                written += 1\n                continue\n'''
          if old not in value and new not in value:
              raise SystemExit('runtime provenance anchor not found')
          value = value.replace(old, new)
          runtime.write_text(value)

          tests = Path('apps/api/tests/test_memory_integration.py')
          test_text = tests.read_text()
          anchor = '''        interest = by_category[MemoryCategory.PRODUCT_INTEREST.value]\n        assert interest.evidence_kind == MemoryEvidenceKind.INFERENCE.value\n        assert interest.verified_at is None\n        assert db.scalar(\n'''
          replacement = '''        interest = by_category[MemoryCategory.PRODUCT_INTEREST.value]\n        assert interest.evidence_kind == MemoryEvidenceKind.INFERENCE.value\n        assert interest.verified_at is None\n        interest_id = interest.id\n        assert db.scalar(\n'''
          if anchor in test_text:
              test_text = test_text.replace(anchor, replacement)
          elif 'interest_id = interest.id' not in test_text:
              raise SystemExit('inference id anchor not found')

          end_anchor = '''        ) is not None\n'''
          append_block = '''        ) is not None\n\n    with TestClient(create_app(TEST_SETTINGS)) as client:\n        login(client, "owner@example.com", "owner password")\n        verified = client.patch(\n            f"/api/v1/tenants/{tenant_id}/contacts/{contact_id}/memories/{interest_id}",\n            json={"verified": True},\n        )\n        assert verified.status_code == 200\n        assert verified.json()["source_type"] == "customer_message"\n        assert verified.json()["source_message_id"] == str(message_id)\n        assert verified.json()["source_conversation_id"] is not None\n        assert verified.json()["verified_at"] is not None\n'''
          if append_block not in test_text:
              pos = test_text.rfind(end_anchor)
              if pos < 0:
                  raise SystemExit('test append anchor not found')
              pos += len(end_anchor)
              test_text = test_text[:pos] + append_block[len(end_anchor):] + test_text[pos:]
          tests.write_text(test_text)
          PY

      - run: uv run ruff format apps/api/src apps/api/tests apps/api/migrations
      - run: uv run ruff check apps/api/src apps/api/tests apps/api/migrations
      - run: uv run ruff format --check apps/api/src apps/api/tests apps/api/migrations
      - run: uv run pyright apps/api/src apps/api/tests
      - name: Migration gate
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: M12 focused integration
        run: uv run pytest apps/api/tests/test_memory_integration.py -q
      - name: Integration regression
        run: uv run pytest apps/api/tests/test_*_integration.py -q
      - name: Unit regression
        run: env -u ENCRYPTION_KEY RUN_DB_INTEGRATION=0 uv run pytest apps/api/tests -q
      - name: Commit provenance-safe M12 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src apps/api/tests apps/api/migrations
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve customer memory provenance"
          git push origin HEAD:feat/m12-customer-memory
