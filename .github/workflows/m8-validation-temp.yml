name: M8 Validation Temporary

on:
  push:
    branches:
      - feat/tool-runtime

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-app-secret
      JWT_SECRET_KEY: test-jwt-secret
      ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tool-runtime
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check apps/api/src apps/api/tests
      - run: uv run ruff format --check apps/api/src apps/api/tests
      - run: uv run pyright
      - run: uv run pytest apps/api/tests/test_tool_runtime.py apps/api/tests/test_agent_runtime.py apps/api/tests/test_ai_gateway_integration.py
