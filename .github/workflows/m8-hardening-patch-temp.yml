name: M8 Hardening Patch Temporary

on:
  push:
    branches:
      - feat/tool-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tool-runtime
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Add M8 hardening coverage
        run: |
          if ! grep -q 'test_rest_adapter_classifies_http_failures_and_timeouts' apps/api/tests/test_tool_runtime.py; then
            printf '%s' '' | base64 -d >> apps/api/tests/test_tool_runtime.py
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/tests/test_tool_integration.py')
          text = path.read_text()
          old = "from customers_manager_hub.tool_runtime import (\n    ToolAdapterRegistry,\n    ToolAdapterRequest,\n    ToolRuntime,\n    ToolRuntimeError,\n)"
          new = "from customers_manager_hub.tool_runtime import (\n    ToolAdapterError,\n    ToolAdapterRegistry,\n    ToolAdapterRequest,\n    ToolRuntime,\n    ToolRuntimeError,\n)"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! grep -q 'test_tool_runtime_hardens_approval_retry_replay_and_output_validation' apps/api/tests/test_tool_integration.py; then
            printf '%s' '' | base64 -d >> apps/api/tests/test_tool_integration.py
          fi
          uv run ruff format apps/api/tests/test_tool_runtime.py apps/api/tests/test_tool_integration.py
          uv run ruff check apps/api/tests/test_tool_runtime.py apps/api/tests/test_tool_integration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/tests/test_tool_runtime.py apps/api/tests/test_tool_integration.py
          git commit -m 'test: harden M8 runtime safety coverage'
          git push origin HEAD:feat/tool-runtime
