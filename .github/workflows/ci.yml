name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend static and unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check apps/api/src apps/api/tests
      - run: uv run ruff format --check apps/api/src apps/api/tests
      - run: uv run pyright apps/api/src apps/api/tests
      - name: Validate operations scripts
        run: |
          python -m py_compile scripts/load_http.py
          bash -n \
            scripts/backup_postgres.sh \
            scripts/restore_postgres.sh \
            scripts/validate_commercial_mvp.sh \
            scripts/smoke_deployment.sh
      - name: Unit regression
        env:
          RUN_DB_INTEGRATION: "0"
        run: uv run pytest apps/api/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate webchat JavaScript
        run: node --check apps/webchat/widget.js

  integration:
    name: Backend integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: cmh
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: customers_manager_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmh -d customers_manager_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://cmh:change-me@localhost:5432/customers_manager_hub
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_INTEGRATION: "1"
      ENCRYPTION_KEY: dmFsaWRfdGVzdF9rZXlfMzJfYnl0ZXNfbG9uZ19fX18=
      TELEGRAM_WEBHOOK_BASE_URL: https://channels.example.test
      RATE_LIMIT_LOGIN_REQUESTS: "10000"
      RATE_LIMIT_PUBLIC_REQUESTS: "100000"
      RATE_LIMIT_WEBHOOK_REQUESTS: "100000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Migration gate
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Commercial MVP integration regression
        run: bash scripts/validate_commercial_mvp.sh --ci

  docker:
    name: Docker and Compose
    runs-on: ubuntu-24.04
    env:
      APP_ENV: development
      ENCRYPTION_KEY: dmFsaWRfdGVzdF9rZXlfMzJfYnl0ZXNfbG9uZ19fX18=
      TELEGRAM_WEBHOOK_BASE_URL: https://channels.example.test
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: |
          docker compose -f compose.yaml config --quiet
          CMH_API_IMAGE=ghcr.io/example/customers-manager-hub-api:0.1.0 \
          CMH_WEB_IMAGE=ghcr.io/example/customers-manager-hub-web:0.1.0 \
          CMH_POSTGRES_IMAGE=ghcr.io/example/customers-manager-hub-postgres:0.1.0 \
            docker compose -f compose.yaml -f compose.release.yaml config --quiet
      - name: Build application images
        run: docker compose -f compose.yaml build api worker web
      - name: Start infrastructure
        run: docker compose -f compose.yaml up -d postgres redis object-storage
      - name: Run migrations inside backend image
        run: docker compose -f compose.yaml run --rm api alembic upgrade head
      - name: Backup and restore smoke
        run: |
          bash scripts/backup_postgres.sh /tmp/cmh-ci.dump
          bash scripts/restore_postgres.sh /tmp/cmh-ci.dump cmh_restore_ci
          docker compose -f compose.yaml exec -T postgres \
            dropdb -U "${POSTGRES_USER:-cmh}" --if-exists cmh_restore_ci
          rm -f /tmp/cmh-ci.dump
      - name: Start application services
        run: docker compose -f compose.yaml up -d api worker web
      - name: Verify readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.yaml logs api worker web
              exit 1
            fi
            sleep 2
          done
      - name: Deployment smoke
        run: bash scripts/smoke_deployment.sh http://127.0.0.1:8000 http://127.0.0.1:3000
      - name: Load-probe smoke
        run: python scripts/load_http.py http://127.0.0.1:8000/health --requests 20 --concurrency 5
      - name: Verify non-root application runtime
        run: |
          test "$(docker compose -f compose.yaml exec -T api id -u)" != "0"
          test "$(docker compose -f compose.yaml exec -T worker id -u)" != "0"
          test "$(docker compose -f compose.yaml exec -T web id -u)" != "0"
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail=200
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
