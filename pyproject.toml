[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "customers-manager-hub"
version = "0.1.0"
description = "Multi-tenant omnichannel AI customer interaction platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.2",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "jsonschema==4.26.0",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.5",
    "redis==8.1.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["customers_manager_hub"]

[tool.pyright]
include = ["apps/api/src", "apps/api/tests"]
extraPaths = ["apps/api/src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
